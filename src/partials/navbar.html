<header
  class="sticky top-0 z-50 w-full border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60"
>
  <div class="container flex h-14 max-w-screen-2xl items-center">
    <a
      _="on click remove .text-primary from .nav"
      class="mr-6 flex items-center space-x-2 cursor-pointer nav md:hidden"
      hx-get="/pages/home/index.html"
      hx-trigger="click"
      hx-target="#main-content"
      hx-swap="innerHTML"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
        />
      </svg>
      <span class="font-bold">Hello UI</span>
    </a>

    <button
      _="on click toggle .hidden on #mobile-menu"
      class="md:hidden mr-2"
      type="button"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
      </svg>
      <span class="sr-only">Toggle menu</span>
    </button>

    <div
      id="mobile-menu"
      class="hidden absolute top-14 left-0 w-full bg-background border-b border-border md:hidden"
    >
      <nav class="flex flex-col py-4 px-6 gap-4">
        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/components/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Components
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/blocks/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Blocks
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/charts/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Charts
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/examples/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Examples
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/icons.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Icons
        </a>
      </nav>
    </div>

    <div class="mr-4 hidden md:flex">
      <a
        _="on click remove .text-primary from .nav"
        class="mr-6 flex items-center space-x-2 cursor-pointer nav"
        hx-get="/pages/home/index.html"
        hx-trigger="click"
        hx-target="#main-content"
        hx-swap="innerHTML"
      >
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
          />
        </svg>
        <span class="hidden font-bold lg:inline-block">Hello UI</span>
      </a>

      <nav class="flex items-center gap-4 text-sm lg:gap-6">
        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/components/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Components
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/blocks/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Blocks
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/charts/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Charts
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/examples/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Examples
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/icons.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Icons
        </a>
      </nav>
    </div>

    <div
      class="flex flex-1 items-center justify-between space-x-2 md:justify-end"
    >
      <div class="w-full flex-1 md:w-auto md:flex-none">
        <button
          class="inline-flex items-center whitespace-nowrap transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input hover:bg-accent hover:text-accent-foreground px-4 py-2 relative h-9 w-full justify-start rounded-md bg-muted/50 text-sm font-normal text-muted-foreground shadow-none sm:pr-12 md:w-40 lg:w-64"
        >
          <span class="hidden lg:inline-flex">Search Documentation...</span>

          <span class="inline-flex lg:hidden">Search...</span>

          <kbd
            class="pointer-events-none absolute right-[0.3rem] top-[0.3rem] hidden h-5 select-none items-center gap-1 rounded border bg-muted px-1.5 font-mono text-[10px] font-medium opacity-100 sm:flex"
          >
            <span class="text-xs">⌘</span>
            K
          </kbd>
        </button>
      </div>

      <nav class="flex items-center gap-1">
        <a
          target="_blank"
          rel="noreferrer"
          href="https://github.com/htmx-ui/hello"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 w-9 px-0"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
          <span class="sr-only">GitHub</span>
        </a>

        <button
          _="on click toggle .dark on <html/>"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 w-9 px-0"
          type="button"
        >
          <svg
            class="h-[1.2rem] w-[1.2rem] rotate-0 scale-100 transition-all dark:-rotate-90 dark:scale-0"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg
            class="absolute h-[1.2rem] w-[1.2rem] rotate-90 scale-0 transition-all dark:rotate-0 dark:scale-100"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span class="sr-only">Toggle theme</span>
        </button>
      </nav>
    </div>
  </div>
</header>
