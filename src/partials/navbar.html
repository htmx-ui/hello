<header
  class="sticky top-0 z-50 w-full border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60"
>
  <div class="container flex h-14 max-w-screen-2xl items-center">
    <a
      _="on click remove .text-primary from .nav"
      class="mr-6 flex items-center space-x-2 cursor-pointer nav md:hidden"
      hx-get="/pages/home/index.html"
      hx-trigger="click"
      hx-target="#main-content"
      hx-swap="innerHTML"
    >
      <svg class="h-6 w-6" viewBox="0 0 512 512" fill="currentColor">
        <path
          d="M432 32H80a64.07 64.07 0 00-64 64v320a64.07 64.07 0 0064 64h352a64.07 64.07 0 0064-64V96a64.07 64.07 0 00-64-64zM96 256a16 16 0 01-10-28.49L150.39 176 86 124.49a16 16 0 1120-25l80 64a16 16 0 010 25l-80 64A16 16 0 0196 256zm160 0h-64a16 16 0 010-32h64a16 16 0 010 32z"
        />
      </svg>
      <span class="font-bold">Hello UI</span>
    </a>

    <button
      _="on click toggle .hidden on #mobile-menu"
      class="md:hidden mr-2"
      type="button"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
      </svg>
      <span class="sr-only">Toggle menu</span>
    </button>

    <div
      id="mobile-menu"
      class="hidden absolute top-14 left-0 w-full bg-background border-b border-border md:hidden"
    >
      <nav class="flex flex-col py-4 px-6 gap-4">
        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/components/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Components
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/blocks/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Blocks
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/charts/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Charts
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/examples/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Examples
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
                toggle .hidden on #mobile-menu
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/icons.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Icons
        </a>
      </nav>
    </div>

    <div class="mr-4 hidden md:flex">
      <a
        _="on click remove .text-primary from .nav"
        class="mr-6 flex items-center space-x-2 cursor-pointer nav"
        hx-get="/pages/home/index.html"
        hx-trigger="click"
        hx-target="#main-content"
        hx-swap="innerHTML"
      >
        <svg class="h-6 w-6 text-foreground" viewBox="0 0 512 512" fill="currentColor">
          <path
            d="M432 32H80a64.07 64.07 0 00-64 64v320a64.07 64.07 0 0064 64h352a64.07 64.07 0 0064-64V96a64.07 64.07 0 00-64-64zM96 256a16 16 0 01-10-28.49L150.39 176 86 124.49a16 16 0 1120-25l80 64a16 16 0 010 25l-80 64A16 16 0 0196 256zm160 0h-64a16 16 0 010-32h64a16 16 0 010 32z"
          />
        </svg>
        <span class="hidden font-bold lg:inline-block">Hello UI</span>
      </a>

      <nav class="flex items-center gap-4 text-sm lg:gap-6">
        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/components/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Components
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/blocks/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Blocks
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/charts/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Charts
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/examples/index.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Examples
        </a>

        <a
          _="on click
                remove .text-primary from .nav
                add .text-primary on me
              end"
          class="transition-colors hover:text-primary text-foreground/80 cursor-pointer nav"
          hx-get="/pages/icons.html"
          hx-trigger="click"
          hx-target="#main-content"
          hx-swap="innerHTML"
        >
          Icons
        </a>
      </nav>
    </div>

    <div
      class="flex flex-1 items-center justify-between space-x-2 md:justify-end"
    >
      <div class="w-full flex-1 md:w-auto md:flex-none">
        <button
          class="inline-flex items-center whitespace-nowrap transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input hover:bg-accent hover:text-accent-foreground px-4 py-2 relative h-9 w-full justify-start rounded-md bg-muted/50 text-sm font-normal text-muted-foreground shadow-none sm:pr-12 md:w-40 lg:w-64"
        >
          <span class="hidden lg:inline-flex">Search Documentation...</span>

          <span class="inline-flex lg:hidden">Search...</span>

          <kbd
            class="pointer-events-none absolute right-[0.3rem] top-[0.3rem] hidden h-5 select-none items-center gap-1 rounded border bg-muted px-1.5 font-mono text-[10px] font-medium opacity-100 sm:flex"
          >
            <span class="text-xs">⌘</span>
            K
          </kbd>
        </button>
      </div>

      <nav class="flex items-center gap-1">
        <a
          target="_blank"
          rel="noreferrer"
          href="https://github.com/htmx-ui/hello"
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 w-9 px-0"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
          <span class="sr-only">GitHub</span>
        </a>

        <button
          _="on click toggle .hidden on .sun toggle .hidden on .moon toggle .dark on document.documentElement"
          class="relative inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 hover:bg-accent hover:text-accent-foreground h-9 w-9 px-0"
          type="button"
        >
          <svg
            class="h-[1.2rem] w-[1.2rem] sun hidden"
            viewBox="0 0 15 15"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.5 0C7.77614 0 8 0.223858 8 0.5V2.5C8 2.77614 7.77614 3 7.5 3C7.22386 3 7 2.77614 7 2.5V0.5C7 0.223858 7.22386 0 7.5 0ZM2.1967 2.1967C2.39196 2.00144 2.70854 2.00144 2.90381 2.1967L4.31802 3.61091C4.51328 3.80617 4.51328 4.12276 4.31802 4.31802C4.12276 4.51328 3.80617 4.51328 3.61091 4.31802L2.1967 2.90381C2.00144 2.70854 2.00144 2.39196 2.1967 2.1967ZM0.5 7C0.223858 7 0 7.22386 0 7.5C0 7.77614 0.223858 8 0.5 8H2.5C2.77614 8 3 7.77614 3 7.5C3 7.22386 2.77614 7 2.5 7H0.5ZM2.1967 12.8033C2.00144 12.608 2.00144 12.2915 2.1967 12.0962L3.61091 10.682C3.80617 10.4867 4.12276 10.4867 4.31802 10.682C4.51328 10.8772 4.51328 11.1938 4.31802 11.3891L2.90381 12.8033C2.70854 12.9986 2.39196 12.9986 2.1967 12.8033ZM12.5 7C12.2239 7 12 7.22386 12 7.5C12 7.77614 12.2239 8 12.5 8H14.5C14.7761 8 15 7.77614 15 7.5C15 7.22386 14.7761 7 14.5 7H12.5ZM10.682 4.31802C10.4867 4.12276 10.4867 3.80617 10.682 3.61091L12.0962 2.1967C12.2915 2.00144 12.608 2.00144 12.8033 2.1967C12.9986 2.39196 12.9986 2.70854 12.8033 2.90381L11.3891 4.31802C11.1938 4.51328 10.8772 4.51328 10.682 4.31802ZM8 12.5C8 12.2239 7.77614 12 7.5 12C7.22386 12 7 12.2239 7 12.5V14.5C7 14.7761 7.22386 15 7.5 15C7.77614 15 8 14.7761 8 14.5V12.5ZM10.682 10.682C10.8772 10.4867 11.1938 10.4867 11.3891 10.682L12.8033 12.0962C12.9986 12.2915 12.9986 12.608 12.8033 12.8033C12.608 12.9986 12.2915 12.9986 12.0962 12.8033L10.682 11.3891C10.4867 11.1938 10.4867 10.8772 10.682 10.682ZM5.5 7.5C5.5 6.39543 6.39543 5.5 7.5 5.5C8.60457 5.5 9.5 6.39543 9.5 7.5C9.5 8.60457 8.60457 9.5 7.5 9.5C6.39543 9.5 5.5 8.60457 5.5 7.5ZM7.5 4.5C5.84315 4.5 4.5 5.84315 4.5 7.5C4.5 9.15685 5.84315 10.5 7.5 10.5C9.15685 10.5 10.5 9.15685 10.5 7.5C10.5 5.84315 9.15685 4.5 7.5 4.5Z"
              fill="currentColor"
              fill-rule="evenodd"
              clip-rule="evenodd"
            />
          </svg>
          <svg
            class="absolute h-[1.2rem] w-[1.2rem] moon"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span class="sr-only">Toggle theme</span>
        </button>
      </nav>
    </div>
  </div>
</header>
