<div class="my-8 w-full min-w-0">
  <div
    class="mb-4 flex items-center space-x-1 text-sm leading-none text-muted-foreground">
    <div class="truncate">Docs</div>

    <svg
      width="15"
      height="15"
      viewBox="0 0 15 15"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="h-3.5 w-3.5">
      <path
        d="M6.1584 3.13508C6.35985 2.94621 6.67627 2.95642 6.86514 3.15788L10.6151 7.15788C10.7954 7.3502 10.7954 7.64949 10.6151 7.84182L6.86514 11.8418C6.67627 12.0433 6.35985 12.0535 6.1584 11.8646C5.95694 11.6757 5.94673 11.3593 6.1356 11.1579L9.565 7.49985L6.1356 3.84182C5.94673 3.64036 5.95694 3.32394 6.1584 3.13508Z"

        fill-rule="evenodd"
        clip-rule="evenodd"></path>
    </svg>

    <div class="text-foreground">Button</div>
  </div>

  <div class="space-y-2">
    <h1 class="scroll-m-20 text-3xl font-bold tracking-tight">Button</h1>

    <p class="text-base text-muted-foreground">
      Displays a button or a component that looks like a button.
    </p>
  </div>

  <div class="space-y-8">
    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Default</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <button
          class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
          _="on click add .animate-pulse for 500ms then remove .animate-pulse">
          Default Button
        </button>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Variants</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex gap-4 flex-wrap">
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
            Primary
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2">
            Secondary
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90 h-9 px-4 py-2">
            Destructive
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-secondary text-secondary-foreground shadow-sm hover:bg-secondary/80 h-9 px-4 py-2">
            Ghost
          </button>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Sizes</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex gap-4 items-center flex-wrap">
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-8 px-3 text-xs">
            Small
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
            Default
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-10 px-6 py-2 text-base">
            Large
          </button>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">With Icons</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex gap-4 flex-wrap">
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2 gap-2">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">

            </svg>
            Microphone
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground h-9 px-4 py-2 gap-2">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7.5 2C6.11929 2 5 3.11929 5 4.5V7.5C5 8.88071 6.11929 10 7.5 10C8.88071 10 10 8.88071 10 7.5V4.5C10 3.11929 8.88071 2 7.5 2ZM3 7.5C3 2.80558 6.80558 2 7.5 2C8.19442 2 12 2.80558 12 7.5C12 8.88071 10.8807 10 9.5 10H8.5C7.67157 10 7 10.6716 7 11.5V12.5C7 13.3284 7.67157 14 8.5 14H9.5C12.5376 14 15 11.5376 15 8.5V7.5C15 3.35786 11.6421 0 7.5 0C3.35786 0 0 3.35786 0 7.5V8.5C0 11.5376 2.46243 14 5.5 14H6.5C7.32843 14 8 13.3284 8 12.5V11.5C8 10.6716 7.32843 10 6.5 10H5.5C4.11929 10 3 8.88071 3 7.5Z" fill="currentColor"/>
            </svg>
            Record
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3.64645 11.3536C3.45118 11.1583 3.45118 10.8417 3.64645 10.6464L10.2929 4L9 2.70711L2.35355 9.35355C2.15829 9.54882 2.15829 9.86501 2.35355 10.0603L3.64645 11.3536Z" fill="currentColor"/>
              <path d="M11.2929 4L10 2.70711L8.70711 4L10 5.29289L11.2929 4Z" fill="currentColor"/>
              <path d="M0 15H15V13H0V15Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">States</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex gap-4 flex-wrap">
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
            _="on click set my.innerHTML to 'Clicked!' then after 1s set my.innerHTML to 'Click me'">
            Click me
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2"
            disabled>
            Disabled
          </button>
          <button
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2 animate-pulse">
            Loading
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
