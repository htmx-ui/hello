<div class="my-8 w-full min-w-0">
  <div
    class="mb-4 flex items-center space-x-1 text-sm leading-none text-muted-foreground">
    <div class="truncate">Docs</div>

    <svg
      width="15"
      height="15"
      viewBox="0 0 15 15"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="h-3.5 w-3.5">
      <path
        d="M6.1584 3.13508C6.35985 2.94621 6.67627 2.95642 6.86514 3.15788L10.6151 7.15788C10.7954 7.3502 10.7954 7.64949 10.6151 7.84182L6.86514 11.8418C6.67627 12.0433 6.35985 12.0535 6.1584 11.8646C5.95694 11.6757 5.94673 11.3593 6.1356 11.1579L9.565 7.49985L6.1356 3.84182C5.94673 3.64036 5.95694 3.32394 6.1584 3.13508Z"
        fill="currentColor"
        fill-rule="evenodd"
        clip-rule="evenodd"></path>
    </svg>

    <div class="text-foreground">Checkbox</div>
  </div>

  <div class="space-y-2">
    <h1 class="scroll-m-20 text-3xl font-bold tracking-tight">Checkbox</h1>

    <p class="text-base text-muted-foreground">
      <span
        data-br=":r1k:"
        data-brr="1"
        style="
          display: inline-block;
          vertical-align: top;
          text-decoration: inherit;
          max-width: 334px;
        ">
      Displays a checkbox for boolean selection.
      </span>
    </p>
  </div>

  <div class="space-y-8">
    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Basic Checkbox</h2>
      <div class="preview flex min-h-[100px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex items-center space-x-2">
          <input
            type="checkbox"
            id="basic-checkbox"
            class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
            _="on change
              if my.checked
                add .bg-primary to me
                add .text-primary-foreground to me
              else
                remove .bg-primary from me
                remove .text-primary-foreground from me" />
          <label for="basic-checkbox" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Accept terms and conditions
          </label>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Checkbox Group</h2>
      <div class="preview flex min-h-[150px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="space-y-3">
          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="newsletter"
              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
              _="on change
                if my.checked
                  add .bg-primary to me
                  add .text-primary-foreground to me
                else
                  remove .bg-primary from me
                  remove .text-primary-foreground from me" />
            <label for="newsletter" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Subscribe to newsletter
            </label>
          </div>
          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="marketing"
              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
              _="on change
                if my.checked
                  add .bg-primary to me
                  add .text-primary-foreground to me
                else
                  remove .bg-primary from me
                  remove .text-primary-foreground from me" />
            <label for="marketing" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Receive marketing emails
            </label>
          </div>
          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="updates"
              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
              _="on change
                if my.checked
                  add .bg-primary to me
                  add .text-primary-foreground to me
                else
                  remove .bg-primary from me
                  remove .text-primary-foreground from me" />
            <label for="updates" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Product updates
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Checkbox with Description</h2>
      <div class="preview flex min-h-[120px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="flex items-start space-x-2">
          <input
            type="checkbox"
            id="backup"
            class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground mt-0.5"
            _="on change
              if my.checked
                add .bg-primary to me
                add .text-primary-foreground to me
              else
                remove .bg-primary from me
                remove .text-primary-foreground from me" />
          <div class="grid gap-1.5 leading-none">
            <label for="backup" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Enable automatic backups
            </label>
            <p class="text-xs text-muted-foreground">
              Your data will be backed up daily at 2 AM.
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">Checkbox States</h2>
      <div class="preview flex min-h-[150px] w-full justify-center p-6 items-center bg-muted/50 rounded-lg">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-md">
          <div class="space-y-3">
            <div class="flex items-center space-x-2">
              <input
                type="checkbox"
                checked
                class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 bg-primary text-primary-foreground" />
              <label class="text-sm font-medium leading-none">
                Checked
              </label>
            </div>
            <div class="flex items-center space-x-2">
              <input
                type="checkbox"
                class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
              <label class="text-sm font-medium leading-none">
                Unchecked
              </label>
            </div>
          </div>
          <div class="space-y-3">
            <div class="flex items-center space-x-2">
              <input
                type="checkbox"
                disabled
                class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50" />
              <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
                Disabled
              </label>
            </div>
            <div class="flex items-center space-x-2">
              <input
                type="checkbox"
                disabled
                checked
                class="peer h-4 w-4 shrink-0 rounded-sm border border-primary shadow focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 bg-primary text-primary-foreground" />
              <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
                Disabled Checked
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
